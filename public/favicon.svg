<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d1c" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="qatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c49" />
      <stop offset="100%" stop-color="#8a1538" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Outer Rim -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="4" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="256" r="160" fill="url(#goldGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Hexagonal Brand Shield -->
  <polygon points="256,76 416,168 416,344 256,436 96,344 96,168" fill="rgba(15, 23, 42, 0.65)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
  <polygon points="256,96 396,176 396,336 256,416 116,336 116,176" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-linejoin="round" />

  <!-- Monogram "IP" -->
  <!-- Letter "I" -->
  <rect x="175" y="166" width="38" height="180" rx="19" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="194" cy="136" r="19" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Letter "P" -->
  <path d="M 248 166 L 310 166 C 352 166 376 190 376 226 C 376 262 352 286 310 286 L 286 286 L 286 346 C 286 356.5 277.5 365 267 365 C 256.5 365 248 356.5 248 346 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Inner P Counter -->
  <path d="M 286 202 L 308 202 C 330 202 340 212 340 226 C 340 240 330 250 308 250 L 286 250 Z" fill="#090d1c" />

  <!-- Modern Accent Sparks -->
  <circle cx="396" cy="176" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="116" cy="336" r="6" fill="#b91c49" filter="url(#glow)" />
</svg>
